name: 공지 수집

on:
  schedule:
    # 10분마다 실행한다. 학교 robots.txt가 허용하는 목록 페이지 한 곳만 요청한다.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - name: 의존성 설치
        working-directory: collector
        run: npm ci

      - name: 수집 실행
        working-directory: collector
        run: node collect.mjs

      - name: 바뀐 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "data: 공지 수집 결과 반영"
            git push
          fi

      # 데이터는 위에서 이미 저장했으므로, 여기서 실패해도 수집한 공지는 남는다.
      - name: DB 반영
        working-directory: collector
        env:
          SUPABASE_URL: https://lpbjaraczpohtdwrqbok.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_TNOTI_KEY }}
        run: node sync.mjs
